services:
  # Primary PostgreSQL database
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./test/fixtures/init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - pggat-test

  # Read replica for testing load balancing
  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - ./test/fixtures/init-replica.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - pggat-test

  # Pggat instance with basic transaction pooling
  pggat-transaction:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CADDY_ADMIN: "off"
    ports:
      - "6432:6432"
    volumes:
      - ./test/configs/transaction.Gatfile:/Gatfile
    command: ["run", "--config", "/Gatfile"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - pggat-test
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6432"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Pggat instance with session pooling
  pggat-session:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CADDY_ADMIN: "off"
    ports:
      - "6433:6433"
    volumes:
      - ./test/configs/session.Gatfile:/Gatfile
    command: ["run", "--config", "/Gatfile"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - pggat-test
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6433"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Pggat instance with hybrid pooling (primary + replica)
  pggat-hybrid:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CADDY_ADMIN: "off"
    ports:
      - "6434:6434"
    volumes:
      - ./test/configs/hybrid.Gatfile:/Gatfile
    command: ["run", "--config", "/Gatfile"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    networks:
      - pggat-test
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6434"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Integration test runner
  integration-tests:
    image: golang:1.25-alpine
    working_dir: /src
    environment:
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_REPLICA_HOST: postgres-replica
      PGGAT_TRANSACTION_HOST: pggat-transaction
      PGGAT_SESSION_HOST: pggat-session
      PGGAT_HYBRID_HOST: pggat-hybrid
      POSTGRES_PASSWORD: postgres
      CGO_ENABLED: 0
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 5 &&
        echo 'Running integration tests...' &&
        go test -v -timeout 30m ./test/integration/...
      "
    depends_on:
      pggat-transaction:
        condition: service_healthy
      pggat-session:
        condition: service_healthy
      pggat-hybrid:
        condition: service_healthy
    networks:
      - pggat-test

networks:
  pggat-test:
    driver: bridge

volumes:
  go-mod-cache:
